<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>FEED_HOUSE_EXACT</title><link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet"><style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}
canvas{display:block;width:100%!important;height:100%!important;image-rendering:pixelated}
#hud{position:fixed;left:10px;top:10px;z-index:20;color:#c8b48a;font-family:monospace;font-size:15px;background:rgba(0,0,0,.5);padding:5px 8px;border-radius:5px}
#joy{position:fixed;left:15px;bottom:25px;width:118px;height:118px;background:rgba(255,255,255,.1);border-radius:50%;z-index:20;border:2px solid rgba(255,255,255,.4)}#stick{position:absolute;left:39px;top:39px;width:40px;height:40px;background:#fff;border-radius:50%}
#look{position:fixed;right:0;top:0;width:65%;height:100%;z-index:10}
#eye{position:fixed;right:10px;top:10px;width:52px;height:52px;background:rgba(255,255,255,.18);border:2px solid #fff;border-radius:50%;z-index:20;display:flex;align-items:center;justify-content:center;font-size:22px}
#fs{position:fixed;right:10px;top:70px;width:52px;height:52px;background:rgba(255,255,255,.18);border:2px solid #fff;border-radius:50%;z-index:20;display:flex;align-items:center;justify-content:center;color:#fff}
#tap{position:fixed;inset:0;background:#000;color:#fff;z-index:99;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:20px;gap:6px}
#end{position:fixed;inset:0;background:#000;z-index:90;display:none;align-items:center;justify-content:center;flex-direction:column}#endText{font-family:'Creepster',cursive;font-size:58px;color:red;text-align:center;line-height:.9;text-shadow:0 0 15px red}
#red{position:fixed;inset:0;background:radial-gradient(circle,transparent 15%,red 180%);z-index:80;pointer-events:none;opacity:0}
#ps1{position:fixed;inset:0;z-index:12;pointer-events:none;opacity:0.45;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0px,transparent 3px);mix-blend-mode:multiply}
.hidden{opacity:0!important;pointer-events:none}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head><body>
<div id="ps1"></div><div id="red"></div>
<div id="tap"><div>TOCA PARA JUGAR</div><div style="font-size:11px;opacity:.6">réplica exacta - afuera + 2do piso con tu foto</div></div>
<div id="hud">✝ <span id="cnt">0/5</span> | 🖼️ <span id="pic">0/1</span><br><span id="where" style="font-size:10px;opacity:.7">AFUERA</span></div>
<div id="eye">👁️</div><div id="fs">⛶</div><div id="joy"><div id="stick"></div></div><div id="look"></div>
<div id="end"><div id="endText">ÉL<br>YA ESTÁ<br>AQUÍ</div></div>
<script type="module">
import * as THREE from 'three';

// AUDIO
let actx=null,escaping=false,rp=0,hasPhoto=false,onSecond=false;
function initAudio(){actx=new(window.AudioContext||window.webkitAudioContext)()}
function paso(){if(!actx||escaping)return;let t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.frequency.value=75;g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.12);}
function collect(){if(!actx)return;let t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.frequency.value=600;g.gain.setValueAtTime(0.35,t);g.gain.linearRampToValueAtTime(0.001,t+0.5);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.5);}
function finalS(){if(!actx)return;let t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(80,t);o.frequency.exponentialRampToValueAtTime(650,t+4);g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(0.5,t+1);g.gain.linearRampToValueAtTime(0,t+4);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+4);}
document.getElementById('tap').addEventListener('click',function(){initAudio();this.style.display='none';});
document.getElementById('fs').addEventListener('click',async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();}else{await document.exitFullscreen();}setTimeout(()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);},350);}catch{}});

// SCENE PS1 - baja resolución para look exacto de tu foto
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x020205,7,26);scene.background=new THREE.Color(0x020205);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,0.1,100);
const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(0.5); // <-- clave para pixelado exacto
document.body.appendChild(renderer.domElement);

// MATERIAL CASA - color tablones desteñidos como tu foto
const houseTex=new THREE.MeshLambertMaterial({color:0xa6a090}); // tablones amarillento-gris como foto
const house=new THREE.Group(); scene.add(house);
const b1=new THREE.Mesh(new THREE.BoxGeometry(5.2,3.2,3.8),houseTex);b1.position.set(4,1.6,-1); house.add(b1);
const roof=new THREE.Mesh(new THREE.ConeGeometry(3.9,1.7,4),new THREE.MeshLambertMaterial({color:0x1a1a1a}));roof.position.set(4,4.05,-1);roof.rotation.y=Math.PI/4; house.add(roof);
// ventanas negras
function blackPlane(w,h,x,y,z){let m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:0x000000}));m.position.set(x,y,z);house.add(m);}
blackPlane(0.9,0.9,3.2,2.3,1.01); blackPlane(0.9,0.9,4.9,2.3,1.01); blackPlane(1.1,1.7,4,0.85,1.01);

// INTERIOR
const floor1=new THREE.Mesh(new THREE.PlaneGeometry(5,3.6),new THREE.MeshLambertMaterial({color:0x2e2a22}));floor1.rotation.x=-Math.PI/2;floor1.position.set(4,0.02,-1);house.add(floor1);
const table=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.4,0.5),new THREE.MeshLambertMaterial({color:0x3b2e1e}));table.position.set(3.1,0.2,-0.4);house.add(table);
const floor2=new THREE.Mesh(new THREE.PlaneGeometry(5,3.6),new THREE.MeshLambertMaterial({color:0x2a2a22}));floor2.rotation.x=-Math.PI/2;floor2.position.set(4,3.22,-1);house.add(floor2);
const stairTrig=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.5,2),new THREE.MeshBasicMaterial({visible:false}));stairTrig.position.set(5.2,0.25,-0.1);scene.add(stairTrig);
const stairDown=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.5,2),new THREE.MeshBasicMaterial({visible:false}));stairDown.position.set(5.2,3.45,-0.1);scene.add(stairDown);
const stairMesh=new THREE.Mesh(new THREE.BoxGeometry(1,0.12,2.3),new THREE.MeshLambertMaterial({color:0x5a4a35}));stairMesh.position.set(5.2,0.9,-0.1);stairMesh.rotation.x=-Math.PI/7;house.add(stairMesh);

// FOTO TUYA PALA
const loader=new THREE.TextureLoader();
const picMat=new THREE.MeshBasicMaterial({color:0xffffff});
loader.load('pala.jpg',t=>{picMat.map=t;picMat.needsUpdate=true;});
const photo=new THREE.Mesh(new THREE.PlaneGeometry(1.4,1),picMat);photo.position.set(4,4.1,-2.87);scene.add(photo);
const glow=new THREE.PointLight(0xffcc66,0.7,3);glow.position.set(4,4.1,-2);scene.add(glow);

// ARBOLES EXACTOS COMO TU FOTO - a la izquierda
function tree(x,z,s=1){const trunk=new THREE.Mesh(new THREE.BoxGeometry(0.18*s,1.4*s,0.18*s),new THREE.MeshLambertMaterial({color:0x0d0d0d}));trunk.position.set(x,0.7*s,z);scene.add(trunk);
let leaves=new THREE.Mesh(new THREE.PlaneGeometry(1.6*s,2.2*s),new THREE.MeshLambertMaterial({color:0x2a3d1f,side:THREE.DoubleSide}));leaves.position.set(x,2.1*s,z);scene.add(leaves);
let l2=leaves.clone();l2.rotation.y=Math.PI/2;scene.add(l2);}
tree(-3.5,-0.5,1.3); tree(-4.8,-0.8,1.4); tree(-3,-1.5,1.2); tree(-5.5,-2,1.1); tree(-2,-2.5,1);

// LUNA como tu foto - borrosa arriba izquierda
const moonTex=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.95});
const moon=new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.2),moonTex);moon.position.set(-5.5,8.5,-19);scene.add(moon);

// SUELO
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshLambertMaterial({color:0x1e2e1a}));ground.rotation.x=-Math.PI/2;scene.add(ground);
scene.add(new THREE.AmbientLight(0xffffff,1.15));
const flash=new THREE.SpotLight(0xfff0c0,18,25,Math.PI/3.5,0.4,1);scene.add(flash);scene.add(flash.target);

// CRUCES
function cross(x,z){const g=new THREE.Group();const m=new THREE.MeshStandardMaterial({color:0x8b5a2b});const v=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.6,0.06),m);v.position.y=0.3;const h=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.08,0.06),m);h.position.y=0.38;g.add(v);g.add(h);g.position.set(x,0.9,z);scene.add(g);return g;}
const crosses=[cross(0,3),cross(-6,-1),cross(8,-3),cross(7,3),cross(2,0)];
let got=0;const cntEl=document.getElementById('cnt'),picEl=document.getElementById('pic'),whereEl=document.getElementById('where');
function hud(){cntEl.textContent=`${got}/5`;picEl.textContent=`${hasPhoto?1:0}/1`; if(got==5&&hasPhoto){escaping=true;finalS();document.getElementById('red').style.opacity=1;setTimeout(()=>document.getElementById('end').style.display='flex',1400);}}

let yaw=-0.7,pitch=0,pos=new THREE.Vector3(-2.5,1.4,5.5),mx=0,mz=0,last=0;
const joy=document.getElementById('joy'),stick=document.getElementById('stick');
joy.addEventListener('touchmove',e=>{let t=e.touches[0],rc=joy.getBoundingClientRect(),dx=t.clientX-(rc.left+59),dy=t.clientY-(rc.top+59),d=Math.min(50,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);dx=Math.cos(a)*d;dy=Math.sin(a)*d;stick.style.transform=`translate(${dx}px,${dy}px)`;mx=dx/50;mz=dy/50;e.preventDefault()},{passive:false});
joy.addEventListener('touchend',()=>{mx=0;mz=0;stick.style.transform='translate(0,0)'});
const look=document.getElementById('look');let lx=0,ly=0,f=true;
look.addEventListener('touchstart',e=>{lx=e.touches[0].clientX;ly=e.touches[0].clientY;f=false});
look.addEventListener('touchmove',e=>{if(f){lx=e.touches[0].clientX;ly=e.touches[0].clientY;f=false;return}let dx=e.touches[0].clientX-lx,dy=e.touches[0].clientY-ly;yaw-=dx*0.006;pitch-=dy*0.006;pitch=Math.max(-1.1,Math.min(1.1,pitch));lx=e.touches[0].clientX;ly=e.touches[0].clientY;e.preventDefault()},{passive:false});
let hidden=false;document.getElementById('eye').onclick=function(){hidden=!hidden;joy.classList.toggle('hidden',hidden);document.getElementById('fs').classList.toggle('hidden',hidden);document.getElementById('hud').classList.toggle('hidden',hidden);this.classList.toggle('hidden',hidden);if(hidden){look.addEventListener('click',()=>{hidden=false;joy.classList.remove('hidden');document.getElementById('fs').classList.remove('hidden');document.getElementById('hud').classList.remove('hidden');document.getElementById('eye').classList.remove('hidden');},{once:true})}};

function loop(){requestAnimationFrame(loop);
if(!escaping){let mov=Math.hypot(mx,mz)>0.08; if(mov&&Date.now()-last>360){paso();last=Date.now();}
 let s=0.12,fx=Math.sin(yaw),fz=Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
 pos.x+=(rx*mx+fx*mz)*s; pos.z+=(rz*mx+fz*mz)*s;
 if(!onSecond&&Math.hypot(pos.x-stairTrig.position.x,pos.z-stairTrig.position.z)<1.3){onSecond=true;pos.y=4.3;pos.z=-0.7;whereEl.textContent='2DO PISO';collect();}
 if(onSecond&&Math.hypot(pos.x-stairDown.position.x,pos.z-stairDown.position.z)<1.3){onSecond=false;pos.y=1.4;pos.z=0.1;whereEl.textContent='PLANTA BAJA';}
 if(!onSecond)pos.y=1.4; else pos.y=4.3;
 crosses.forEach(c=>{if(c.visible){let d=Math.hypot(c.position.x-pos.x,c.position.z-pos.z); if(d<1.4){c.visible=false;got++;collect();hud();}}});
 if(!hasPhoto){let d=Math.hypot(photo.position.x-pos.x,photo.position.z-pos.z); if(d<2&&onSecond){hasPhoto=true;photo.visible=false;collect();hud();}}
 crosses.forEach(c=>{if(c.visible)c.rotation.y+=0.015;});
}else{rp+=0.015;if(rp>1)rp=1;scene.fog.color.setRGB(0.02+rp*0.6,0.02*(1-rp),0.02*(1-rp));scene.background.setRGB(0.02+rp*0.3,0,0);flash.intensity=18*(1-rp);document.getElementById('red').style.opacity=rp;}
camera.position.set(pos.x,pos.y,pos.z);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
flash.position.set(pos.x,pos.y,pos.z);flash.target.position.set(pos.x+Math.sin(yaw)*6,pos.y+Math.sin(pitch)*6,pos.z+Math.cos(yaw)*6);
moon.lookAt(camera.position);
renderer.render(scene,camera);
}loop();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
