<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>HOUSE_INSIDE</title><link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet"><style>body{margin:0;overflow:hidden;background:#000;touch-action:none}canvas{display:block;image-rendering:pixelated}#hud{position:fixed;left:12px;top:12px;z-index:20;color:#d6b48a;font-family:monospace;font-size:18px}#joy{position:fixed;left:15px;bottom:25px;width:120px;height:120px;background:rgba(255,255,255,.12);border-radius:50%;z-index:20;border:2px solid rgba(255,255,255,.5)}#stick{position:absolute;left:40px;top:40px;width:40px;height:40px;background:#fff;border-radius:50%}#look{position:fixed;right:0;top:0;width:65%;height:100%;z-index:10}#eye{position:fixed;right:12px;top:12px;width:54px;height:54px;background:rgba(255,255,255,.2);border:2px solid #fff;border-radius:50%;z-index:20;display:flex;align-items:center;justify-content:center;font-size:24px}#fs{position:fixed;right:12px;top:76px;width:54px;height:54px;background:rgba(255,255,255,.2);border:2px solid #fff;border-radius:50%;z-index:20;display:flex;align-items:center;justify-content:center;color:#fff}#tap{position:fixed;inset:0;background:#000;color:#fff;z-index:99;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:22px;gap:8px}#end{position:fixed;inset:0;background:#000;z-index:90;display:none;align-items:center;justify-content:center;flex-direction:column}#endText{font-family:'Creepster',cursive;font-size:56px;color:red;text-align:center;line-height:.9;text-shadow:0 0 15px red}#red{position:fixed;inset:0;background:radial-gradient(circle,transparent 10%,red 180%);z-index:80;pointer-events:none;opacity:0}#vhs{position:fixed;inset:0;z-index:15;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0px,transparent 2px);opacity:.5}.hidden{opacity:0!important;pointer-events:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head><body><div id="vhs"></div><div id="red"></div><div id="tap"><div>TOCA PARA ENTRAR</div><div style="font-size:12px;opacity:.6">entra a la casa y sube al 2do piso</div></div><div id="hud">✝ <span id="cnt">0 / 5</span> | 🖼️ <span id="pic">0/1</span></div><div id="eye">👁️</div><div id="fs">⛶</div><div id="joy"><div id="stick"></div></div><div id="look"></div><div id="end"><div id="endText">ÉL<br>YA ESTÁ<br>AQUÍ</div><div style="color:#888;font-family:monospace;margin-top:20px">ENCUENTRA LA PALA AFUERA</div></div><script type="module">import*as THREE from'three';
let actx=null,escaping=false,rp=0,hasPhoto=false;
function initAudio(){actx=new(window.AudioContext||window.webkitAudioContext)()}
function paso(){if(!actx||escaping)return;let t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.frequency.value=75;g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.15);}
function collect(){if(!actx)return;let t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.frequency.value=650;g.gain.setValueAtTime(0.4,t);g.gain.linearRampToValueAtTime(0.001,t+0.6);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.6);}
function finalS(){if(!actx)return;let t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(700,t+4);g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(0.5,t+1);g.gain.linearRampToValueAtTime(0,t+4);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+4);}
document.getElementById('tap').addEventListener('click',function(){initAudio();this.style.display='none';});
document.getElementById('fs').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}});

const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x020205,5,22);scene.background=new THREE.Color(0x020205);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);
const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(0.6);document.body.appendChild(renderer.domElement);

// LUNA
const moon=new THREE.Mesh(new THREE.PlaneGeometry(2.5,2.5),new THREE.MeshBasicMaterial({color:0xffffff}));moon.position.set(-6,9,-18);scene.add(moon);

// CASA EXTERIOR
const houseMat=new THREE.MeshLambertMaterial({color:0x8f8f87});
const base=new THREE.Mesh(new THREE.BoxGeometry(5,3,4),houseMat);base.position.set(4,1.5,-1);scene.add(base);
const roof=new THREE.Mesh(new THREE.ConeGeometry(3.5,1.8,4),new THREE.MeshLambertMaterial({color:0x222222}));roof.position.set(4,3.9,-1);roof.rotation.y=Math.PI/4;scene.add(roof);

// INTERIOR PLANTA BAJA
const wallMat=new THREE.MeshLambertMaterial({color:0x6b6b60});
const floor1=new THREE.Mesh(new THREE.PlaneGeometry(4.8,3.8),new THREE.MeshLambertMaterial({color:0x2a2a22}));floor1.rotation.x=-Math.PI/2;floor1.position.set(4,0.01,-1);scene.add(floor1);
// muebles pocos
const table=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.5,0.6),new THREE.MeshLambertMaterial({color:0x3d2f1f}));table.position.set(3.2,0.25,-0.5);scene.add(table);
const chair=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.6,0.4),new THREE.MeshLambertMaterial({color:0x3d2f1f}));chair.position.set(3.2,0.3,-1.2);scene.add(chair);

// ESCALERAS - rampa simple
const stairs=new THREE.Mesh(new THREE.BoxGeometry(1,0.15,2.2),new THREE.MeshLambertMaterial({color:0x4a3f35}));stairs.position.set(5.5,0.8,-0.2);stairs.rotation.x=-Math.PI/6;scene.add(stairs);
const stairs2=new THREE.Mesh(new THREE.BoxGeometry(1,0.15,1),new THREE.MeshLambertMaterial({color:0x4a3f35}));stairs2.position.set(5.5,1.9,-1.5);scene.add(stairs2);

// SEGUNDO PISO
const floor2=new THREE.Mesh(new THREE.PlaneGeometry(4.8,3.8),new THREE.MeshLambertMaterial({color:0x2a2a22}));floor2.rotation.x=-Math.PI/2;floor2.position.set(4,3.01,-1);scene.add(floor2);
const ceil2=new THREE.Mesh(new THREE.BoxGeometry(5,0.15,4),new THREE.MeshLambertMaterial({color:0x1a1a1a}));ceil2.position.set(4,5.2,-1);scene.add(ceil2);
// paredes segundo piso (hueco para entrar)
const wall2a=new THREE.Mesh(new THREE.BoxGeometry(0.2,2.2,4),wallMat);wall2a.position.set(1.6,4.1,-1);scene.add(wall2a);
const wall2b=new THREE.Mesh(new THREE.BoxGeometry(5,2.2,0.2),wallMat);wall2b.position.set(4,4.1,-2.9);scene.add(wall2b);
const wall2c=new THREE.Mesh(new THREE.BoxGeometry(0.2,2.2,2),wallMat);wall2c.position.set(6.4,4.1,0);scene.add(wall2c);

// FOTO DE LA PALA - TU IMAGEN
const loader=new THREE.TextureLoader();
const picMat=new THREE.MeshBasicMaterial({color:0xffffff}); // se cambia al cargar
loader.load('pala.jpg',tex=>{picMat.map=tex;picMat.needsUpdate=true;},null,()=>{console.log('sube pala.jpg al repo');});
const photoFrame=new THREE.Mesh(new THREE.PlaneGeometry(1.2,0.9),picMat);photoFrame.position.set(4,3.8,-2.85);photoFrame.rotation.y=Math.PI; // mirando hacia adentro
scene.add(photoFrame);
const photoLight=new THREE.PointLight(0xffcc88,1,3);photoLight.position.set(4,3.8,-2);scene.add(photoLight);

// árboles y suelo afuera
function tree(x,z){const trunk=new THREE.Mesh(new THREE.BoxGeometry(0.18,1.2,0.18),new THREE.MeshLambertMaterial({color:0x111111}));trunk.position.set(x,0.6,z);scene.add(trunk);const leaves=new THREE.Mesh(new THREE.PlaneGeometry(1.5,1.8),new THREE.MeshLambertMaterial({color:0x253a1f,side:THREE.DoubleSide}));leaves.position.set(x,1.9,z);scene.add(leaves);let l2=leaves.clone();l2.rotation.y=Math.PI/2;scene.add(l2);}
for(let i=0;i<25;i++){tree(-2-Math.random()*12,(Math.random()-0.5)*18);}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshLambertMaterial({color:0x1f2f1a}));ground.rotation.x=-Math.PI/2;scene.add(ground);
scene.add(new THREE.AmbientLight(0xcccccc,1));
const flash=new THREE.SpotLight(0xfff2cc,14,22,Math.PI/4,0.3,1);scene.add(flash);scene.add(flash.target);

// CRUCES
function makeCross(x,z,y=0.9){const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:0x8b5a2b});const v=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.6,0.06),mat);v.position.y=0.3;const h=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.08,0.06),mat);h.position.y=0.38;g.add(v);g.add(h);g.position.set(x,y,z);scene.add(g);return g;}
const crosses=[makeCross(0,2),makeCross(-5,-2),makeCross(6,-4),makeCross(7,2),makeCross(3.8,0.5,0.9)];
let got=0;const cntEl=document.getElementById('cnt'),picEl=document.getElementById('pic');
function checkWin(){if(got==crosses.length && hasPhoto){escaping=true; finalS(); document.getElementById('red').style.opacity=1; setTimeout(()=>document.getElementById('end').style.display='flex',1400);}}
function updateHud(){cntEl.textContent=`${got} / ${crosses.length}`; picEl.textContent=`${hasPhoto?1:0}/1`; checkWin();}

// CONTROLES
let yaw=-0.5,pitch=0,pos=new THREE.Vector3(-1,1.4,4),mx=0,mz=0,lastStep=0;
const joy=document.getElementById('joy'),stick=document.getElementById('stick');
joy.addEventListener('touchmove',e=>{let t=e.touches[0],rc=joy.getBoundingClientRect(),dx=t.clientX-(rc.left+60),dy=t.clientY-(rc.top+60),d=Math.min(50,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);dx=Math.cos(a)*d;dy=Math.sin(a)*d;stick.style.transform=`translate(${dx}px,${dy}px)`;mx=dx/50;mz=dy/50;e.preventDefault()},{passive:false});
joy.addEventListener('touchend',()=>{mx=0;mz=0;stick.style.transform='translate(0,0)'});
const look=document.getElementById('look');let lx=0,ly=0,f=true;
look.addEventListener('touchstart',e=>{lx=e.touches[0].clientX;ly=e.touches[0].clientY;f=false});
look.addEventListener('touchmove',e=>{if(f){lx=e.touches[0].clientX;ly=e.touches[0].clientY;f=false;return}let dx=e.touches[0].clientX-lx,dy=e.touches[0].clientY-ly;yaw-=dx*0.006;pitch-=dy*0.006;pitch=Math.max(-1.1,Math.min(1.1,pitch));lx=e.touches[0].clientX;ly=e.touches[0].clientY;e.preventDefault()},{passive:false});
let hidden=false; document.getElementById('eye').onclick=function(){hidden=!hidden; joy.classList.toggle('hidden',hidden); document.getElementById('fs').classList.toggle('hidden',hidden); document.getElementById('hud').classList.toggle('hidden',hidden); this.classList.toggle('hidden',hidden); if(hidden){look.addEventListener('click',()=>{hidden=false;joy.classList.remove('hidden');document.getElementById('fs').classList.remove('hidden');document.getElementById('hud').classList.remove('hidden');document.getElementById('eye').classList.remove('hidden');},{once:true})}};

function loop(){requestAnimationFrame(loop);
 if(!escaping){
  let mov=Math.hypot(mx,mz)>0.1; if(mov&&Date.now()-lastStep>380){paso();lastStep=Date.now();}
  let s=0.09,fx=Math.sin(yaw),fz=Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  let nx=pos.x+(rx*mx+fx*mz)*s, nz=pos.z+(rz*mx+fz*mz)*s;
  // colision casa y escaleras
  let ny=pos.y;
  // si estás cerca de escaleras sube
  if(pos.x>4.8 && pos.x<6.2 && pos.z>-1.8 && pos.z<0.5){
    let prog=(pos.z+0.5)/2.3; // 0 abajo, 1 arriba
    ny=1.4+prog*1.8;
    if(prog>0.85) ny=4.2; // segundo piso
  }else{
    if(pos.y>3) ny=4.2; else ny=1.4;
  }
  // paredes casa planta baja: si no estás dentro no importa, si estás dentro limita
  let insideHouse = nx>1.7 && nx<6.3 && nz>-2.9 && nz<1;
  if(!insideHouse || (ny<3 && (Math.abs(nx-4)<2.2 && Math.abs(nz+1)<1.7)) || ny>3){
    pos.x=nx; pos.z=nz; pos.y=ny;
  }else{
    // dejar pasar por puerta
    if(Math.abs(nx-4)<0.7 && Math.abs(nz-1)<0.3){pos.x=nx; pos.z=nz; pos.y=ny;}
  }

  crosses.forEach(c=>{if(c.visible){let d=Math.hypot(c.position.x-pos.x,c.position.z-pos.z); if(d<1.3){c.visible=false; got++; collect(); updateHud();}}});
  // foto
  if(!hasPhoto){let d=Math.hypot(photoFrame.position.x-pos.x, photoFrame.position.z-pos.z); let dy=Math.abs(photoFrame.position.y-pos.y); if(d<1.5 && dy<1.2){hasPhoto=true; photoFrame.visible=false; collect(); updateHud();}}
  crosses.forEach(c=>{if(c.visible)c.rotation.y+=0.015;});
  photoFrame.rotation.y+=0.005;
 }else{ rp+=0.015; if(rp>1)rp=1; scene.fog.color.setRGB(0.02+rp*0.6,0.02*(1-rp),0.02*(1-rp)); scene.background.setRGB(0.02+rp*0.3,0,0); flash.intensity=14*(1-rp); document.getElementById('red').style.opacity=rp; }
 camera.position.set(pos.x,pos.y,pos.z); camera.rotation.order='YXZ'; camera.rotation.y=yaw; camera.rotation.x=pitch;
 flash.position.set(pos.x,pos.y,pos.z); flash.target.position.set(pos.x+Math.sin(yaw)*6,pos.y+Math.sin(pitch)*6,pos.z+Math.cos(yaw)*6);
 moon.lookAt(camera.position);
 renderer.render(scene,camera);
}loop();
</script></body></html>
